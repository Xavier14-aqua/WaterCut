name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Upload unit test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WaterCut-unit-tests
          path: out/review-unit/report.json
          if-no-files-found: warn
      - run: npm run make
      - run: npm run smoke -- --packaged
      - run: npm run smoke -- --ideas --packaged
      - run: npm run smoke -- --stage3 --packaged
      - run: npm run smoke -- --patch131 --packaged
      - run: npm run smoke -- --boxes --packaged
      - run: npm run smoke -- --stage4a --packaged
      - run: npm run audit:dist
      - uses: actions/upload-artifact@v7
        with:
          name: WaterCut-windows-x64
          path: |
            out/make/zip/win32/x64/*.zip
            out/make/zip/win32/x64/SHA256SUMS.txt
            .build-resources/build-info.json
          if-no-files-found: error
