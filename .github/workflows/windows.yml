name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Upload unit test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WaterCut-unit-tests
          path: out/review-unit/report.json
          if-no-files-found: warn
      - run: npm run make
      - run: npm run smoke -- --scenario=core --packaged
      - run: npm run smoke -- --scenario=inspiration --packaged
      - run: npm run smoke -- --scenario=delivery --packaged
      - run: npm run smoke -- --scenario=editor --packaged
      - run: npm run smoke -- --scenario=organization --packaged
      - run: npm run smoke -- --scenario=professional --packaged
      - name: Repeat BGM playback in a fresh renderer
        run: npm run smoke -- --scenario=professional --bgm-only --packaged
      - name: Verify BGM suspension during loading
        env:
          WATERCUT_BGM_SCENARIO: suspend-during-load
        run: npm run smoke -- --scenario=professional --bgm-only --packaged
      - name: Verify held video cannot cancel BGM loading
        env:
          WATERCUT_BGM_SCENARIO: paused-video-position
        run: npm run smoke -- --scenario=professional --bgm-only --packaged
      - run: npm run audit:dist
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WaterCut-native-diagnostics
          path: |
            out/review-*/report*.json
            out/review-*/failure*.json
            out/review-*/failure*.png
            out/review-professional/playback*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: WaterCut-windows-x64
          path: |
            out/make/zip/win32/x64/*.zip
            out/make/zip/win32/x64/SHA256SUMS.txt
            .build-resources/build-info.json
          if-no-files-found: error
